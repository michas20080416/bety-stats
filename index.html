// running scripts that sit mid-page (the ▶ scan box). Scripts parsed that way never run, so each one is replaced
// by a fresh copy, which runs right away, in page order.
const show=async(html)=>{
  if(document.readyState==='loading')await new Promise((r)=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.documentElement.replaceWith(document.adoptNode(doc.documentElement));
  for(const old of [...document.querySelectorAll('script')]){
    const s=document.createElement('script');
    for(const a of old.attributes)s.setAttribute(a.name,a.value);
    s.textContent=old.textContent;
    old.replaceWith(s);
  }
};
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(SALT),iterations:ROUNDS,hash:'SHA-256'},base,256));
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem('betyKey')}catch(e){}
  if(saved){try{await show(await decrypt(b64(saved)));return}catch(e){try{localStorage.removeItem('betyKey')}catch(e2){}}}
  const f=document.getElementById('f');f.hidden=false;document.getElementById('p').focus();
  f.addEventListener('submit',async(ev)=>{
    ev.preventDefault();document.getElementById('e').textContent='Unlocking…';
    const raw=await derive(document.getElementById('p').value);
    let html;
    try{html=await decrypt(raw)}catch(e){document.getElementById('e').textContent='Wrong password.';return}
    if(document.getElementById('r').checked){try{localStorage.setItem('betyKey',btoa(String.fromCharCode(...raw)))}catch(e){}}
    await show(html);
  });
})();
})();
